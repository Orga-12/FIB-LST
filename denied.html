<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>FIB · Kein Zugang</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#090b0e;color:#dde4f0;font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{background:#0d1018;border:1px solid #2a1010;border-radius:16px;padding:3rem 2.5rem;text-align:center;max-width:380px;width:90%;}
.icon{font-size:3rem;margin-bottom:1rem;}
h1{font-size:1.6rem;color:#ef4444;margin-bottom:.5rem;}
p{font-size:.85rem;color:#4a5568;margin-bottom:1.5rem;}
a{display:inline-block;background:#1a1f2a;border:1px solid #2a3040;color:#94a3b8;padding:.6rem 1.5rem;border-radius:8px;text-decoration:none;font-size:.85rem;}
a:hover{border-color:#5865F2;color:#fff;}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🚫</div>
  <h1>Kein Zugang</h1>
  <p>Du bist kein Mitglied des FIB Discord-Servers und hast daher keinen Zugang zum Dashboard.</p>
  <a href="/logout">← Zurück zum Login</a>
</div>
</body>
</html>
