<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIB · Login</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&family=Barlow:wght@300;400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#08090c;
  font-family:'Barlow',sans-serif;
  font-weight:300;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* Animated background */
.bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 100% 60% at 50% -20%, rgba(201,168,76,.12) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(88,101,242,.06) 0%, transparent 50%),
    #08090c;
}
.grid{
  position:fixed;inset:0;z-index:0;
  background-image:
    linear-gradient(rgba(201,168,76,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201,168,76,.04) 1px, transparent 1px);
  background-size:40px 40px;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, black 0%, transparent 100%);
}

/* Floating orbs */
.orb{
  position:fixed;border-radius:50%;filter:blur(80px);z-index:0;
  animation:float 8s ease-in-out infinite;
}
.orb1{width:400px;height:400px;background:rgba(201,168,76,.06);top:-100px;left:-100px;animation-delay:0s}
.orb2{width:300px;height:300px;background:rgba(88,101,242,.05);bottom:-50px;right:-50px;animation-delay:3s}
.orb3{width:200px;height:200px;background:rgba(201,168,76,.04);top:50%;right:10%;animation-delay:6s}

@keyframes float{
  0%,100%{transform:translateY(0px) scale(1)}
  50%{transform:translateY(-20px) scale(1.05)}
}

/* Card */
.card{
  position:relative;z-index:1;
  background:rgba(12,15,22,.9);
  border:1px solid rgba(201,168,76,.15);
  border-radius:20px;
  padding:3rem 2.5rem;
  text-align:center;
  max-width:420px;
  width:90%;
  backdrop-filter:blur(20px);
  box-shadow:
    0 0 0 1px rgba(201,168,76,.05),
    0 20px 60px rgba(0,0,0,.5),
    0 0 80px rgba(201,168,76,.04) inset;
}

/* Top accent line */
.card::before{
  content:'';
  position:absolute;top:0;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,.5),transparent);
  border-radius:1px;
}

.emblem{
  width:72px;height:72px;
  background:linear-gradient(135deg,rgba(201,168,76,.15),rgba(201,168,76,.05));
  border:1px solid rgba(201,168,76,.25);
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;
  margin:0 auto 1.5rem;
  box-shadow:0 8px 24px rgba(201,168,76,.1);
}

.sup{
  font-family:'Share Tech Mono',monospace;
  font-size:.6rem;letter-spacing:.4em;
  color:#8a6f2e;text-transform:uppercase;
  margin-bottom:.4rem;
}

h1{
  font-family:'Rajdhani',sans-serif;
  font-size:2rem;font-weight:700;
  color:#c9a84c;letter-spacing:.06em;
  margin-bottom:.2rem;
  text-shadow:0 0 30px rgba(201,168,76,.2);
}

.subtitle{
  font-size:.82rem;color:#4a5878;
  margin-bottom:2rem;line-height:1.5;
}

/* Discord Button */
.btn-discord{
  display:flex;align-items:center;justify-content:center;gap:.75rem;
  background:linear-gradient(135deg,#5865F2,#4752c4);
  color:#fff;
  padding:.9rem 2rem;border-radius:10px;
  font-family:'Rajdhani',sans-serif;font-size:1.05rem;font-weight:700;
  letter-spacing:.05em;text-decoration:none;
  transition:all .2s;border:none;cursor:pointer;width:100%;
  box-shadow:0 4px 20px rgba(88,101,242,.3),0 0 0 1px rgba(88,101,242,.2);
}
.btn-discord:hover{
  background:linear-gradient(135deg,#6472f3,#5865F2);
  transform:translateY(-2px);
  box-shadow:0 8px 30px rgba(88,101,242,.4),0 0 0 1px rgba(88,101,242,.3);
}
.btn-discord:active{transform:translateY(0)}
.btn-discord svg{width:22px;height:22px;fill:#fff;flex-shrink:0}

.divider{
  display:flex;align-items:center;gap:.8rem;
  margin:1.5rem 0;
}
.divider::before,.divider::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,168,76,.1),transparent);
}
.divider span{
  font-family:'Share Tech Mono',monospace;
  font-size:.6rem;color:#1e2a3a;letter-spacing:.2em;
  white-space:nowrap;
}

.note{
  font-family:'Share Tech Mono',monospace;
  font-size:.65rem;color:#1e2a3a;
  letter-spacing:.05em;
}
.note span{color:#2a3a52}
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="card">
  <div class="emblem">⚖️</div>
  <div class="sup">// Federal Investigation Bureau</div>
  <h1>Corruption Office</h1>
  <p class="subtitle">Melde dich mit deinem Discord-Account an.<br>Zugang nur für Server-Mitglieder.</p>

  <a href="/login" class="btn-discord">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
    </svg>
    Mit Discord anmelden
  </a>

  <div class="divider"><span>// SECURE ACCESS</span></div>
  <p class="note">Nur Mitglieder des <span>FIB Discord-Servers</span> erhalten Zugang</p>
</div>
</body>
</html>
